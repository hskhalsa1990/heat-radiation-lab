[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-radiation-lab"
version = "3.0.0"
description = "Thermal radiation toolkit: Stefan-Boltzmann, Planck, Wien, data cleaning, ML, computer vision, dashboard"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Harpreet Singh" }]
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib", "scipy", "scikit-learn", "tabulate"]

[project.optional-dependencies]
dashboard = ["streamlit"]
deep = ["torch"]

[project.scripts]
heat-radiation = "radiation:main"
heat-radiation-report = "report:main"

[tool.setuptools]
py-modules = ["radiation", "radiation_extra", "data_clean", "analyst", "thermal", "report", "make_data"]
